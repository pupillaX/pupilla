<footer class="site-footer">
  <div class="site-footer-inner">
    <div class="footer-subscribe">
      <p class="footer-subscribe-label">Get notified of new articles &amp; essays</p>
      <form action="https://buttondown.com/api/emails/embed-subscribe/pupilla"
            method="post" target="popupwindow"
            onsubmit="window.open('https://buttondown.com/pupilla', 'popupwindow')"
            class="subscribe-form">
        <input type="email" name="email" placeholder="your@email.com" aria-label="Email address" required />
        <button type="submit">Subscribe</button>
      </form>
    </div>
    <nav class="footer-links" aria-label="Footer">
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/contributors/' | relative_url }}">Contributors</a>
      <a href="{{ '/privacy-policy/' | relative_url }}">Privacy</a>
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="#" id="cookie-settings-link">Cookie settings</a>
    </nav>
    <p class="footer-copyright">&copy; {{ 'now' | date: "%Y" }} {{ site.title }} · {{ site.description }}</p>
  </div>
</footer>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var c = document.getElementById('cookie-settings-link');
  if (c) c.addEventListener('click', function(e) {
    e.preventDefault();
    localStorage.removeItem('cookieConsent');
    localStorage.removeItem('googleAnalyticsConsent');
    window.location.reload();
  });
  document.querySelectorAll('a[href$=".pdf"]').forEach(function(link) {
    link.addEventListener('click', function() {
      if (typeof gtag !== 'undefined') {
        gtag('event', 'pdf_download', { file_name: this.getAttribute('href'), page_title: document.title });
      }
    });
  });
});
</script>
