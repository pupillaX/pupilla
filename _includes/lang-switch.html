<script>
/* Earlier shared links used ?lang=es on the default URL. Every language now has its own page
   (/…/slug/es/), so send such visitors there. */
(function () {
  var want = (new URLSearchParams(window.location.search).get('lang') || '').toLowerCase();
  var toggle = document.getElementById('langToggle');
  if (!want || !toggle) return;
  var links = toggle.querySelectorAll('a');
  for (var i = 0; i < links.length; i++) {
    if (links[i].getAttribute('hreflang') === want) {
      if (!links[i].classList.contains('active')) window.location.replace(links[i].getAttribute('href') + window.location.hash);
      return;
    }
  }
})();
</script>
