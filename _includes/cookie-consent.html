<!-- Cookie consent: analytics stay off unless the visitor accepts. Styles live in assets/css/site.css. -->
<div id="cookie-consent-banner" class="cookie-consent-banner" role="dialog" aria-modal="false"
     aria-labelledby="cookie-consent-title" aria-describedby="cookie-consent-desc" style="display: none;">
  <div class="cookie-consent-content">
    <div class="cookie-consent-text">
      <p id="cookie-consent-title" class="cookie-consent-title">Cookies &amp; privacy</p>
      <p id="cookie-consent-desc">We'd like to use Google Analytics cookies to see how the site is used. They stay off unless you accept.
        <a href="{{ '/privacy-policy/' | relative_url }}" target="_blank" rel="noopener">Privacy Policy</a></p>
    </div>
    <div class="cookie-consent-buttons">
      <button id="cookie-reject" class="cookie-btn" type="button">Reject</button>
      <button id="cookie-accept" class="cookie-btn" type="button">Accept</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';
  
  // Check if user has already made a choice
  const consentStatus = localStorage.getItem('cookie-consent');
  const banner = document.getElementById('cookie-consent-banner');
  
  // Show banner if no consent given
  if (!consentStatus) {
    banner.style.display = 'block';
  } else if (consentStatus === 'accepted') {
    // User previously accepted, load analytics
    loadGoogleAnalytics();
  }
  
  // Accept button
  document.getElementById('cookie-accept').addEventListener('click', function() {
    localStorage.setItem('cookie-consent', 'accepted');
    banner.style.display = 'none';
    loadGoogleAnalytics();
  });
  
  // Reject button
  document.getElementById('cookie-reject').addEventListener('click', function() {
    localStorage.setItem('cookie-consent', 'rejected');
    banner.style.display = 'none';
    // Disable analytics if already loaded
    if (typeof gtag !== 'undefined') {
      gtag('consent', 'update', {
        'analytics_storage': 'denied'
      });
    }
  });
  
  function loadGoogleAnalytics() {
    // Only load if not already loaded
    if (typeof gtag === 'undefined') {
      // Load gtag script
      const script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}';
      document.head.appendChild(script);
      
      script.onload = function() {
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', '{{ site.google_analytics }}', {
          'send_page_view': true,
          'anonymize_ip': true
        });
        console.log('Google Analytics loaded with consent');
      };
    }
  }
})();
</script>
